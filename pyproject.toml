[project]
name = "tmls"
version = "0.1.0"
description = "tmux sessions from every host in one TUI: list, attach in a tab, open in a window"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2",
    "pyte>=0.8.2",
    "aiohttp>=3.14.3",
]

[project.scripts]
tmls = "tmls.app:main"
ct = "tmls.ct:main"
ag = "tmls.ag:main"
tmls-web = "tmls.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
