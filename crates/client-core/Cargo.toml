[package]
name = "client-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tmls-rs desktop v0: hosts, session listing, status marks, tmux commands, config (no UI)"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# local_time: FileTimeToSystemTime and SystemTimeToTzSpecificLocalTime; the WSL holder:
# GetStdHandle and SetHandleInformation
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Time", "Win32_System_Console"] }

[dev-dependencies]
# tests/tmux_real.rs runs the attach command on a PTY
s2-core = { path = "../../spikes/s2-core" }
