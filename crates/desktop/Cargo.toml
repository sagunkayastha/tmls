[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tmls-rs desktop v0: native window with the tmls sidebar and tmux sessions in tabs"

[lib]
name = "desktop"
path = "src/lib.rs"

[[bin]]
name = "tmls-rs"
path = "src/main.rs"

[dependencies]
client-core = { path = "../client-core" }
s2-core = { path = "../../spikes/s2-core" }
s2-wgpu = { path = "../../spikes/s2-wgpu" }
winit = "0.30"
wgpu = "30"
pollster = "1"
anyhow = "1"
# Reads tmls's notifications.json (the version client-core uses).
serde_json = "1"
# Same features as s2-wgpu: no image support, data-control for wlroots/KDE Wayland.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
