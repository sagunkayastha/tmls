[workspace]
resolver = "3"
members = ["spikes/s0", "spikes/s1", "spikes/s2-core", "spikes/s2-wgpu", "spikes/s2-gpui",
           "crates/client-core", "crates/desktop"]
# GUI crates are built with -p in Docker; a bare cargo build/test on archbox stays headless.
default-members = ["spikes/s0", "spikes/s1", "spikes/s2-core", "crates/client-core"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
