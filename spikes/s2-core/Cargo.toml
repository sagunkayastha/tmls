[package]
name = "s2-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tmls-rs spike S2: PTY + emulator thread + Frame + key encoding + latency log (no GUI)"

[dependencies]
libghostty-vt = "=0.2.2"
portable-pty = "0.9"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
