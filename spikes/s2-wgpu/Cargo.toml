[package]
name = "s2-wgpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tmls-rs spike S2: wgpu front-end for the interaction slice"

[dependencies]
s2-core = { path = "../s2-core" }
wgpu = "30"
cosmic-text = "0.19"
swash = "0.2"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
unicode-width = "0.2"
anyhow = "1"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
