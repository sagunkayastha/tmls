<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: the on-screen keyboard shrinks the page, so the terminal refits above it -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>tmls</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <button id="menu" title="Sessions">☰</button>
  <button id="tab-terminal" class="tab on">Terminal</button>
  <button id="tab-sketch" class="tab">Sketch</button>
  <span id="title">pick a session</span>
  <span class="grow"></span>
  <button id="zoom-out" title="Smaller (Ctrl −)">A−</button>
  <button id="zoom-in" title="Bigger (Ctrl =)">A+</button>
  <span id="zoom-size">14px</span>
  <button id="bell" title="Alerts">🔔<span id="bell-count"></span></button>
  <button id="reload" title="Reload the page">↻</button>
  <button id="settings" title="Settings">⚙</button>
</header>
<div id="feed" hidden>live feed lost · reconnecting…</div>
<div id="alerts" hidden></div>
<div id="settings-menu" hidden>
  <form method="post" action="/logout"><button id="logout">Log out</button></form>
</div>
<main>
  <aside id="rows"></aside>
  <section id="pane">
    <div id="term"></div>
    <div id="sketch" hidden></div>
    <div id="overlay" hidden><p id="overlay-text"></p><button id="reattach" hidden>Reattach</button></div>
    <p id="empty">Pick a session<span class="wide"> on the left</span>.</p>
  </section>
  <div id="shade"></div>
</main>
<!-- phones: the keys a soft keyboard lacks; Ctrl arms the next key -->
<div id="keys">
  <button data-key="Keyboard" title="Show or hide the keyboard">⌨</button><button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button data-key="Ctrl">Ctrl</button>
  <button data-key="Paste">Paste</button><button data-key="Copy">Copy</button>
  <button data-key="Up">↑</button><button data-key="Down">↓</button><button data-key="Left">←</button><button data-key="Right">→</button>
  <button data-key="/">/</button><button data-key="-">-</button><button data-key="|">|</button>
</div>
<!-- phones: the terminal's recent text as plain text, for the phone's own select-and-copy -->
<div id="copyview" hidden>
  <div class="panel">
    <div class="row"><button id="copy-all">Copy all</button><span class="hint">or long-press to select</span><button id="copy-close">✕</button></div>
    <pre id="copy-text"></pre>
  </div>
</div>
<div id="new" hidden>
  <form id="new-form" autocomplete="off">
    <div id="new-title">New session</div>
    <label><span>Folder</span><input id="new-folder" spellcheck="false"></label>
    <label><span>Name</span><input id="new-name" spellcheck="false" autocapitalize="none" autocorrect="off"></label>
    <div class="start"><span>Start</span><div id="new-start"></div></div>
    <div id="new-error"></div>
    <div class="buttons"><button type="button" id="new-cancel">Cancel</button><button id="new-create">Create</button></div>
  </form>
</div>
<div id="manage" hidden>
  <form id="manage-form" autocomplete="off">
    <div id="manage-title"></div>
    <label><span>Name</span><input id="manage-name" spellcheck="false" autocapitalize="none" autocorrect="off"></label>
    <div id="manage-warning"></div>
    <div id="manage-error"></div>
    <div class="buttons"><button type="button" id="manage-kill" class="danger">Kill…</button><span class="grow"></span><button type="button" id="manage-cancel">Cancel</button><button id="manage-rename">Rename</button></div>
  </form>
</div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
